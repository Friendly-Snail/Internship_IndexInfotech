name: pokedex

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    env_file:
      - .env.postgres
    # Bun runs in WSL and connects through this host port.
    # 5433 avoids the usual Windows PostgreSQL port, 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
