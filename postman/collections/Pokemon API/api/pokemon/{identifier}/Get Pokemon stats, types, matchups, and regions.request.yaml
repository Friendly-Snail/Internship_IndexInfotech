$kind: http-request
description: Finds or caches the Pokemon. regionsComplete distinguishes unchecked from checked-with-no-encounters. Attack examples use one defending type and simplified scoring.
url: "{{baseUrl}}/api/pokemon/:identifier"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: identifier
    value: pikachu
    disabled: false
    description: Pokemon name or positive ID as a string. Trimmed and lowercased; numeric IDs must be safe integers.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "pattern": "^(?:[a-z][a-z0-9]*(?:-[a-z0-9]+)*|[1-9][0-9]*)$"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Get Pokemon stats, types, matchups, and regions.resources/examples
order: 2000
