$kind: http-example
name: Missing or blank region.
request:
  url: "{{baseUrl}}/api/regions/region-search?region=kanto"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    region: kanto
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 2000
