$kind: http-example
name: Database or unexpected server failure.
request:
  url: "{{baseUrl}}/api/pokedex/create"
  method: POST
  headers:
    - key: Origin
      value: http://localhost:3000
      disabled: false
      description: Match BETTER_AUTH_URL. Browsers supply Origin automatically; PowerShell/Postman must supply it explicitly for ownership changes.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "pokemon": "pikachu"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      }
order: 7000
