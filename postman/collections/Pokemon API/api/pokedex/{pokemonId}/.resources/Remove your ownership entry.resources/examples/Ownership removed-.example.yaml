$kind: http-example
name: Ownership removed.
request:
  url: "{{baseUrl}}/api/pokedex/:pokemonId"
  method: DELETE
  headers:
    - key: Origin
      value: http://localhost:3000
      disabled: false
      description: Match BETTER_AUTH_URL. Browsers supply Origin automatically; PowerShell/Postman must supply it explicitly for ownership changes.
    - key: Accept
      value: application/json
    - key: better-auth.session_token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: pokemonId
      value: "25"
      disabled: false
      description: Positive numeric Pokemon ID from your list as a path string; maximum 2147483647. Names are rejected.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "removed": true,
        "pokemonId": 25
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "removed": {
            "type": "boolean"
          },
          "pokemonId": {
            "type": "integer"
          }
        },
        "required": [
          "removed",
          "pokemonId"
        ]
      }
order: 1000
