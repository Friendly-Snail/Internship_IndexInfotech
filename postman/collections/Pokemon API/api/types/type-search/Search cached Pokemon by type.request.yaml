url: "{{baseUrl}}/api/types/type-search?type=water"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: type
    value: water
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Search cached Pokemon by type.resources/examples
order: 1000
