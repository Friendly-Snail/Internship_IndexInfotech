$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/sign-in/email"
  method: POST
  headers:
    - key: Origin
      value: http://localhost:3000
      disabled: false
      description: Recommended for API clients; match BETTER_AUTH_URL. Better Auth rejects untrusted browser origins. Browsers supply this header automatically.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "ash@example.com",
        "password": "Pikachu-Test-123!"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
    - key: Set-Cookie
      value: string
      disabled: false
      description: Sets the signed HttpOnly cookie; retain it in the client's cookie jar.
      $type: string
  body:
    type: json
    content: |-
      {
        "redirect": false,
        "token": "string",
        "user": {
          "id": "string",
          "name": "string",
          "email": "string",
          "emailVerified": false,
          "createdAt": "1958-06-29T03:52:15.936Z",
          "updatedAt": "2018-08-24T03:49:11.130Z",
          "image": "string"
        },
        "url": "string"
      }
    $type: |-
      {
        "description": "Session response when idToken is provided",
        "type": "object",
        "properties": {
          "redirect": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "token": {
            "type": "string",
            "description": "Session token"
          },
          "url": {
            "type": [
              "string",
              "null"
            ]
          },
          "user": {
            "type": "object",
            "properties": {
              "name": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "image": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "createdAt": {
                "type": "string",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "name",
              "email",
              "emailVerified",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "redirect",
          "token",
          "user"
        ]
      }
order: 1000
