$kind: http-request
description: Sign up a user using email and password. Sets an HttpOnly session cookie. Email/password authentication is enabled; email verification delivery is not configured.
url: "{{baseUrl}}/api/auth/sign-up/email"
method: POST
headers:
  - key: Origin
    value: http://localhost:3000
    disabled: false
    description: Recommended for API clients; match BETTER_AUTH_URL. Better Auth rejects untrusted browser origins. Browsers supply this header automatically.
    $type: string
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ash",
      "email": "ash@example.com",
      "password": "Pikachu-Test-123!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "description": "The name of the user"
        },
        "email": {
          "type": "string",
          "description": "The email of the user"
        },
        "password": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128,
          "description": "The password of the user"
        },
        "image": {
          "type": "string",
          "description": "The profile image URL of the user"
        },
        "callbackURL": {
          "type": "string",
          "description": "The URL to use for email verification callback"
        },
        "rememberMe": {
          "type": "boolean",
          "description": "If this is false, the session will not be remembered. Default is `true`."
        }
      },
      "required": [
        "name",
        "email",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Sign up a user using email and password.resources/examples
order: 1000
