$kind: http-example
name: Not Found. The requested resource was not found.
request:
  url: "{{baseUrl}}/api/auth/get-session"
  method: POST
  headers:
    - key: Origin
      value: http://localhost:3000
      disabled: false
      description: Recommended for API clients; match BETTER_AUTH_URL. Better Auth rejects untrusted browser origins. Browsers supply this header automatically.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: "{}"
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "code": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      }
order: 5000
