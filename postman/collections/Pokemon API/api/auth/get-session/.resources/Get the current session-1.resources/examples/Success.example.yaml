$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/get-session"
  method: POST
  headers:
    - key: Origin
      value: http://localhost:3000
      disabled: false
      description: Recommended for API clients; match BETTER_AUTH_URL. Better Auth rejects untrusted browser origins. Browsers supply this header automatically.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: "{}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "null"
    $type: |-
      {
        "type": [
          "object",
          "null"
        ]
      }
order: 1000
