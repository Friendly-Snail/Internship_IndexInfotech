$kind: http-request
description: "Safe user fields and session ID/expiry only; omits token, password, IP, and user agent. Cache-Control: no-store."
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: apikey
  credentials:
    key: better-auth.session_token
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Identify the signed-in trainer.resources/examples
order: 1000
